<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skyze DEBUG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: monospace; font-size: 12px; padding: 10px; }
  #status { color: #facc15; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
  #log { display: flex; flex-direction: column; gap: 4px; }
  .entry { background: #1e1e1e; border-left: 3px solid #444; padding: 4px 8px; border-radius: 4px; word-break: break-all; }
  .entry.msg  { border-color: #22c55e; color: #86efac; }
  .entry.err  { border-color: #ef4444; color: #fca5a5; }
  .entry.info { border-color: #3b82f6; color: #93c5fd; }
  .entry.warn { border-color: #f59e0b; color: #fcd34d; }
</style>
</head>
<body>
<div id="status">iniciando…</div>
<div id="log"></div>
<script>
  const params  = new URLSearchParams(location.search);
  const session = params.get('session') || '';
  const logEl   = document.getElementById('log');
  const statusEl = document.getElementById('status');

  function log(text, type='info') {
    const d = document.createElement('div');
    d.className = `entry ${type}`;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
    logEl.prepend(d);
    if (logEl.children.length > 80) logEl.removeChild(logEl.lastChild);
  }

  log(`URL completa: ${location.href}`, 'info');
  log(`Session: "${session}"`, session ? 'info' : 'err');
  log(`Protocolo: ${location.protocol}`, 'info');

  window.addEventListener('message', e => {
    log(`postMessage: ${JSON.stringify(e.data)}`, 'msg');
  });

  if (!session) {
    statusEl.textContent = '⚠ sem session ID';
    log('Adicione ?session=SEU_ID na URL', 'err');
  } else {
    /* Testa WSS externo em todos os canais */
    statusEl.textContent = 'testando WSS externo (canais 1-4)…';

    [1,2,3,4].forEach(ch => {
      const ws = new WebSocket('wss://io.socialstream.ninja:443');
      ws.onopen = () => {
        ws.send(JSON.stringify({ join: session, in: ch, out: ch }));
        log(`WSS externo canal ${ch} → conectado`, 'info');
      };
      ws.onmessage = e => {
        if (!e.data || e.data === 'pong') return;
        log(`✅ WSS canal ${ch} RECEBEU: ${e.data}`, 'msg');
        statusEl.textContent = `✅ recebendo no canal ${ch}!`;
      };
      ws.onclose = (ev) => log(`WSS canal ${ch} fechou (code: ${ev.code})`, 'warn');
      ws.onerror = ()  => log(`WSS canal ${ch} ERRO`, 'err');
    });

    /* Testa SSE */
    log('Testando SSE…', 'info');
    const es = new EventSource(`https://io.socialstream.ninja/sse/${session}`);
    es.onopen = () => log('SSE conectado', 'info');
    es.onmessage = e => {
      if (!e.data || e.data === 'ping') return;
      log(`✅ SSE RECEBEU: ${e.data}`, 'msg');
      statusEl.textContent = '✅ SSE recebendo!';
    };
    es.onerror = () => log('SSE erro/reconectando', 'warn');

    /* Testa localserver ws://127.0.0.1:3000 */
    log('Testando localserver 127.0.0.1:3000…', 'info');
    try {
      const wsLocal = new WebSocket('ws://127.0.0.1:3000');
      wsLocal.onopen = () => {
        log('✅ localserver CONECTOU!', 'msg');
        statusEl.textContent = '✅ localserver ativo!';
      };
      wsLocal.onmessage = e => {
        if (!e.data || e.data === 'pong') return;
        log(`✅ localserver RECEBEU: ${e.data}`, 'msg');
      };
      wsLocal.onerror = () => log('localserver 3000 → bloqueado ou inativo', 'err');
      wsLocal.onclose = () => log('localserver 3000 fechou', 'warn');
    } catch(e) {
      log(`localserver exception: ${e.message}`, 'err');
    }
  }
</script>
</body>
</html>
